[package]
name = "age-tpm-wsl-post-quantum"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
# Windows custody restores a seed; public-only Linux encryption needs no seed API.
seed-restoration = ["aws-lc-rs/experimental-kem-seed"]

[dependencies]
aws-lc-rs = { version = "=1.18.2", default-features = false, features = ["alloc", "non-fips", "prebuilt-nasm"] }
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "nistp", "mlkem", "chacha", "aes", "getrandom"] }
sha2 = "=0.10.9"
zeroize = "=1.9.1"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
poly1305 = { version = "=0.9.1", default-features = false, features = ["zeroize"] }
hpke-sha2 = { package = "sha2", version = "=0.11.1", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["zeroize"] }

[dev-dependencies]
hex = "0.4"
serde_json = "=1.0.154"
