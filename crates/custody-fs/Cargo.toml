[package]
name = "windows-custody-fs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_Foundation", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Com", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_System_Ioctl"] }
